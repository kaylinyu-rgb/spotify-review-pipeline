# Render Blueprint: one web service = FastAPI backend + the dashboard page it serves.
# The database is external Postgres (Supabase or Neon); paste its URL as DATABASE_URL in Render.
services:
  - type: web
    name: spotify-review-insights
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DATABASE_URL
        sync: false
